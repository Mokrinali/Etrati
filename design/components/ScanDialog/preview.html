<!doctype html>
<html lang="ka" data-theme="light">
<head><meta charset="utf-8"><title>ScanDialog</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="et-pad" style="padding:0"><div class="et-dialog" style="width:auto;border-radius:0;box-shadow:none;border:0;height:520px;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)"><span data-i="scan" style="color:var(--brand-text)"></span><b style="font-size:15px">სკანის გასუფთავება</b></div>
<div style="flex:1;display:flex;gap:12px;padding:16px;min-height:0">
<div style="width:200px;display:flex;flex-direction:column;gap:8px">
<div class="et-filelist" style="flex:1"><div class="is-sel" data-i="image">IMG_2041.HEIC<span class="et-st">1</span></div><div data-i="image">IMG_2042.jpg<span class="et-st">2</span></div><div data-i="page">ანგარიში.pdf<span class="et-st">3–5</span></div><div data-i="image">blur.jpg<span class="et-st is-bad">ვერ იკითხება</span></div></div>
<div class="et-row"><button class="et-btn is-sm" data-i="plus">დამატება…</button><button class="et-btn is-sm is-ghost">ამოღება</button></div>
</div>
<div class="et-pane"><span class="et-label">ორიგინალი: კუთხეები გადაათრიეთ</span><div class="et-stage">
<svg width="230" height="300" viewBox="0 0 230 300"><rect x="0" y="0" width="230" height="300" fill="#8a8178"/><polygon points="30,26 205,40 196,280 22,268" fill="#f4f1ea"/><polygon points="30,26 205,40 196,280 22,268" fill="var(--mark-crop-fill)" stroke="var(--mark-crop)" stroke-width="2"/><g fill="#b8b2a8"><rect x="48" y="60" width="120" height="5"/><rect x="46" y="76" width="140" height="4"/><rect x="45" y="88" width="136" height="4"/><rect x="44" y="100" width="128" height="4"/></g></svg>
<span class="et-handle" style="left:calc(50% - 115px + 30px);top:calc(50% - 150px + 26px)"></span><span class="et-handle" style="left:calc(50% - 115px + 205px);top:calc(50% - 150px + 40px)"></span><span class="et-handle" style="left:calc(50% - 115px + 196px);top:calc(50% - 150px + 280px)"></span><span class="et-handle" style="left:calc(50% - 115px + 22px);top:calc(50% - 150px + 268px)"></span>
</div></div>
<div class="et-splitter"></div>
<div class="et-pane"><span class="et-label">შედეგი</span><div class="et-stage"><div class="et-paper" style="width:200px;height:270px;padding:20px 18px"><i style="display:block;height:5px;width:60%;background:#cfc9bf;margin-bottom:12px"></i><i style="display:block;height:4px;background:#d9d4cc;margin-bottom:8px"></i><i style="display:block;height:4px;background:#d9d4cc;margin-bottom:8px"></i><i style="display:block;height:4px;width:80%;background:#d9d4cc"></i></div></div></div>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:0 16px 12px;flex-wrap:wrap">
<button class="et-btn is-sm">კუთხეები ავტომატურად</button><button class="et-btn is-sm">მთელი კადრი</button>
<span class="et-check is-on" style="margin-left:8px"><span class="et-box" data-i="check" data-s="12"></span>სტრიქონების გასწორება</span>
<span class="et-label" style="margin-left:12px">რეჟიმი</span><span class="et-input" style="height:28px;width:210px"><select><option>ფერადი (ბეჭდებისთვის)</option></select><span data-i="down" class="et-muted"></span></span>
<span class="et-label">ტექსტის ენა</span><span class="et-input" style="height:28px;width:200px"><select><option>ქართული + ინგლისური</option></select><span data-i="down" class="et-muted"></span></span>
</div>
<div class="et-dlg-foot" style="justify-content:space-between;align-items:center"><span class="et-help">საწყისი ფაილები არ იცვლება. ყველაფერი ამ კომპიუტერზე სრულდება.</span><span class="et-row"><button class="et-btn is-ghost">დახურვა</button><button class="et-btn is-primary">PDF-ის შექმნა…</button></span></div>
</div></div>
<script>window.Etrati.icons();</script>
<button onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'" style="position:fixed;right:8px;bottom:8px;z-index:9;font:12px sans-serif">თემა ☀/☾</button>
</body>
</html>
