<!doctype html>
<html lang="ka" data-theme="light">
<head><meta charset="utf-8"><title>ProgressDialog</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="et-pad et-row" style="align-items:flex-start;gap:24px">
<div class="et-dialog" style="width:360px"><div style="padding:20px 20px 12px;display:flex;flex-direction:column;gap:10px"><b>გვერდები მუშავდება…</b><div class="et-progress"><span style="width:58%"></span></div><span class="et-help">გვერდი 7 / 12</span></div><div class="et-dlg-foot" style="padding:10px 20px"><button class="et-btn">გაუქმება</button></div></div>
<div class="et-col" style="gap:10px"><span class="et-row"><span class="et-spinner"></span><span class="et-muted">ფაილი მოწმდება…</span></span><span class="et-row"><span class="et-spinner"></span><span class="et-muted">იხსნება…</span></span></div>
</div>
<script>window.Etrati.icons();</script>
<button onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'" style="position:fixed;right:8px;bottom:8px;z-index:9;font:12px sans-serif">თემა ☀/☾</button>
</body>
</html>
