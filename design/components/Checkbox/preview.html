<!doctype html>
<html lang="ka" data-theme="light">
<head><meta charset="utf-8"><title>Checkbox</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="et-pad et-col">
<div class="et-row" style="gap:20px">
<span class="et-check is-on"><span class="et-box" data-i="check" data-s="12"></span>ორიგინალის შენახვა</span>
<span class="et-check"><span class="et-box"></span>კომენტარების წაშლა</span>
<span class="et-check et-radio is-on"><span class="et-box"></span>ყველა გვერდი</span>
<span class="et-check et-radio"><span class="et-box"></span>მონიშნული</span>
</div>
<div class="et-row"><span class="et-check is-on"><span class="et-toggle"></span>ავტომატური შენახვა</span></div>
</div>
<script>window.Etrati.icons();</script>
<button onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'" style="position:fixed;right:8px;bottom:8px;z-index:9;font:12px sans-serif">თემა ☀/☾</button>
</body>
</html>
