<!doctype html>
<html lang="ka" data-theme="light">
<head><meta charset="utf-8"><title>SignaturePad</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="et-pad"><div class="et-dialog" style="width:460px">
<div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:12px"><b style="font-size:15px">ხელმოწერის სურათი</b>
<span class="et-segs is-inline"><span class="et-seg is-active">დახატვა</span><span class="et-seg">აკრეფა</span><span class="et-seg">სურათი</span></span>
<div style="height:120px;background:var(--paper);border:1px dashed var(--line-strong);border-radius:var(--radius-md);display:grid;place-items:center"><svg width="220" height="70" viewBox="0 0 220 70"><path d="M10 50c20-4 26-38 40-38s-6 40 12 38 18-30 30-28 2 26 18 26 20-18 34-18 16 12 66 6" fill="none" stroke="var(--ink-signature)" stroke-width="2.6" stroke-linecap="round"/></svg></div>
<div class="et-banner is-info" data-i="info"><p>ეს მხოლოდ სურათია. იურიდიული ძალის ციფრული ხელმოწერისთვის გამოიყენეთ სერტიფიკატი.</p></div>
</div>
<div class="et-dlg-foot" style="margin-top:16px;justify-content:space-between"><button class="et-btn is-ghost">გასუფთავება</button><span class="et-row"><button class="et-btn is-ghost">გაუქმება</button><button class="et-btn is-primary">ჩასმა</button></span></div>
</div></div>
<script>window.Etrati.icons();</script>
<button onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'" style="position:fixed;right:8px;bottom:8px;z-index:9;font:12px sans-serif">თემა ☀/☾</button>
</body>
</html>
