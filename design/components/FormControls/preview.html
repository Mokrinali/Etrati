<!doctype html>
<html lang="ka" data-theme="light">
<head><meta charset="utf-8"><title>FormControls</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="et-pad" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<label class="et-field"><span class="et-label">ფაილის სახელი</span><span class="et-input"><input value="აქტი_ოქტომბერი"></span></label>
<label class="et-field"><span class="et-label">ფორმატი</span><span class="et-input"><select><option>Word (.docx)</option></select><span data-i="down" class="et-muted"></span></span></label>
<label class="et-field"><span class="et-label">პაროლი</span><span class="et-input is-error"><input type="password" value="12345"></span><span class="et-help is-error">პაროლი არასწორია. სცადეთ ხელახლა.</span></label>
<label class="et-field"><span class="et-label">გვერდები</span><span class="et-input"><input placeholder="მაგ. 1-3, 5"></span><span class="et-help">ცარიელი = ყველა გვერდი</span></label>
</div>
<script>window.Etrati.icons();</script>
<button onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'" style="position:fixed;right:8px;bottom:8px;z-index:9;font:12px sans-serif">თემა ☀/☾</button>
</body>
</html>
