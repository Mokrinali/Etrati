<!doctype html>
<html lang="ka" data-theme="light">
<head><meta charset="utf-8"><title>ColorSwatches</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="et-pad et-col">
<div class="et-swatches"><span class="et-sw is-on" style="background:var(--ink-pen)"></span><span class="et-sw" style="background:var(--mark-highlight)"></span><span class="et-sw" style="background:var(--mark-edit)"></span><span class="et-sw" style="background:var(--mark-crop)"></span><span class="et-sw" style="background:var(--ink-signature)"></span><span class="et-sw" style="background:#231f1b"></span><button class="et-tool" data-i="plus" title="სხვა ფერი…"></button></div>
<span class="et-help">ანოტაციის ფერი — ბოლო არჩეული ინახება პარამეტრებში</span>
</div>
<script>window.Etrati.icons();</script>
<button onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'" style="position:fixed;right:8px;bottom:8px;z-index:9;font:12px sans-serif">თემა ☀/☾</button>
</body>
</html>
