<!doctype html>
<html lang="ka" data-theme="light">
<head><meta charset="utf-8"><title>Toolbar</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="et-toolbar"><button class="et-tool is-on" data-i="sidebar" data-s="20"></button><button class="et-tool" data-i="open" data-s="20"></button><button class="et-tool" data-i="save" data-s="20"></button><button class="et-tool" data-i="print" data-s="20"></button><span class="et-sep"></span><button class="et-tool" data-i="undo" data-s="20"></button><button class="et-tool" data-i="redo" data-s="20"></button><button class="et-tool" data-i="pages" data-s="20"></button><span class="et-sep"></span><button class="et-tool" data-i="up" data-s="20"></button><button class="et-tool" data-i="down" data-s="20"></button><input class="et-spin" value="2"><span class="et-pageno">&nbsp;/ 24&nbsp;</span><span class="et-sep"></span><button class="et-tool" data-i="zoomout" data-s="20"></button><span class="et-combo">100%<span data-i="down" data-s="14"></span></span><button class="et-tool" data-i="zoomin" data-s="20"></button><button class="et-tool" data-i="fitw" data-s="20"></button><button class="et-tool" data-i="fitp" data-s="20"></button><span class="et-sep"></span><button class="et-tool" data-i="two" data-s="20"></button><button class="et-tool" data-i="rotate" data-s="20"></button><button class="et-tool" data-i="search" data-s="20"></button><button class="et-tool is-on" data-i="ai" data-s="20"></button></div>
<div class="et-toolbar"><button class="et-tool" data-i="select" data-s="18"></button><button class="et-tool is-on" data-i="highlight" data-s="18"></button><button class="et-tool" data-i="underline" data-s="18"></button><button class="et-tool" data-i="strike" data-s="18"></button><span class="et-sep"></span><button class="et-tool" data-i="note" data-s="18"></button><button class="et-tool" data-i="text" data-s="18"></button><span class="et-sep"></span><button class="et-tool" data-i="ink" data-s="18"></button><button class="et-tool" data-i="rect" data-s="18"></button><button class="et-tool" data-i="ellipse" data-s="18"></button><button class="et-tool" data-i="line" data-s="18"></button><button class="et-tool" data-i="arrow" data-s="18"></button><span class="et-sep"></span><button class="et-tool" data-i="stamp" data-s="18"></button><button class="et-tool" data-i="image" data-s="18"></button><span class="et-sep"></span><button class="et-tool" data-i="edit" data-s="18"></button><button class="et-tool" data-i="redact" data-s="18"></button><button class="et-tool" data-i="field" data-s="18"></button><span class="et-sep"></span><button class="et-tool" data-i="sign" data-s="18"></button><span class="et-swatches" style="margin-left:6px"><span class="et-sw is-on" style="background:var(--ink-pen)"></span><span class="et-sw" style="background:var(--mark-highlight)"></span><span class="et-sw" style="background:var(--mark-crop)"></span><span class="et-sw" style="background:#231f1b"></span><button class="et-tool" data-i="plus" data-s="18"></button></span></div>
<script>window.Etrati.icons();</script>
<button onclick="var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'" style="position:fixed;right:8px;bottom:8px;z-index:9;font:12px sans-serif">თემა ☀/☾</button>
</body>
</html>
