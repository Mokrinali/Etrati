# Runs the test suite on a clean Windows machine for every pull request and every push to main.
# The runner has no Microsoft Office, so the Office conversion tests skip themselves
# ("Office is not installed"); everything else must pass.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: OCR language data (cached)
        uses: actions/cache@v4
        with:
          path: data/tessdata
          key: tessdata-${{ hashFiles('scripts/get_tessdata.ps1') }}

      - name: Download OCR language data
        shell: powershell
        run: powershell -File scripts\get_tessdata.ps1

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider -rfEs --durations=15 --junitxml=pytest.xml

      - name: Summary
        if: always()
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          lines = ["## Test results", ""]
          try:
              root = ET.parse("pytest.xml").getroot()
              suite = root if root.tag == "testsuite" else root[0]
              a = suite.attrib
              lines.append(f"tests {a['tests']}, failures {a['failures']}, errors {a['errors']}, skipped {a['skipped']}")
              for case in suite.iter("testcase"):
                  for kind in ("failure", "error"):
                      bad = case.find(kind)
                      if bad is not None:
                          msg = (bad.get("message") or "").splitlines()[0][:200] if bad.get("message") else ""
                          lines.append(f"- **{kind}** `{case.get('classname')}.{case.get('name')}`: {msg}")
          except Exception as e:
              lines.append(f"no results: {e}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
